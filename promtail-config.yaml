server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: telemetry
    static_configs:
      - targets:
          - localhost
        labels:
          job: telemetry
          __path__: /var/log/telemetry/telemetry.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            ts: ts
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
          event: